name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check --diff .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest
      - name: Test-code quality (SCRAP for pytest, ADR-0004)
        shell: bash
        run: |
          # Fails only on structural errors; the report goes to the job summary either way.
          status=0
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          PYTHONPATH=tools python -m scrap tests > scrap.txt || status=$?
          tee -a "$GITHUB_STEP_SUMMARY" < scrap.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
