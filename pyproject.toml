[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-mask-net"
version = "0.1.0"
description = "Hypernetwork-generated query-aware dimension masking for dense retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "safetensors",
    "numpy",
    "faiss-cpu",
    "beir",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
