[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperdime-qwen"
version = "0.0.1"
description = "Environment-conditioned hypernetwork for query-aware dimension selection on Qwen3-Embedding-0.6B"
readme = "README.md"
requires-python = ">=3.11"
# torch comes from the `cpu` or `cu128` extra, each mapped to its PyTorch wheel index (research R3).
dependencies = [
  "hydra-core>=1.3,<1.4",
  "numpy>=2",
  "omegaconf>=2.3,<2.4",
  "pydantic>=2.7,<3",
]

[project.scripts]
hyperdime = "hyperdime.cli.__main__:main"

[project.optional-dependencies]
cpu = ["torch>=2.4"]
cu128 = ["torch>=2.4"]
embed = ["transformers>=4.51"]
# Later milestones; locked now so their tickets add code, not dependencies.
data = ["datasets>=3", "ir-datasets>=0.5"]
science = ["scipy>=1.13", "scikit-learn>=1.5", "ir-measures>=0.3"]
deploy = ["faiss-cpu>=1.8"]
dev = ["pytest==9.1.1", "ruff==0.16.7", "mypy==2.3.1", "pre-commit>=4"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]
# Vendored spec-kit tooling is not project code.
extend-exclude = [".specify", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["hyperdime", "scrap"]

[tool.mypy]
# numpy >= 2.5 stubs use Python 3.12 syntax; ruff still enforces 3.11-compatible code.
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tools"]
strict = true
ignore_missing_imports = true
