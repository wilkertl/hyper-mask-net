[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperdime-qwen"
version = "0.0.1"
description = "Environment-conditioned hypernetwork for query-aware dimension selection on Qwen3-Embedding-0.6B"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
embed = ["transformers>=4.51"]
dev = ["pytest==9.1.1", "ruff==0.16.7", "mypy==2.3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Vendored spec-kit tooling is not project code.
extend-exclude = [".specify", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["hyperdime"]

[tool.mypy]
# numpy >= 2.5 stubs use Python 3.12 syntax; ruff still enforces 3.11-compatible code.
python_version = "3.12"
files = ["src"]
strict = true
ignore_missing_imports = true
