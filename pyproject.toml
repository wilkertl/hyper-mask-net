[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperdime-qwen"
version = "0.0.1"
description = "Environment-conditioned hypernetwork for query-aware dimension selection on Qwen3-Embedding-0.6B"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "hydra-core>=1.3,<1.4",
  "numpy>=2",
  "omegaconf>=2.3,<2.4",
  "pydantic>=2.7,<3",
  "torch>=2.4",
]

[project.scripts]
hyperdime = "hyperdime.cli.__main__:main"

[project.optional-dependencies]
embed = ["transformers>=4.51"]
dev = ["pytest==9.1.1", "ruff==0.16.7", "mypy==2.3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]
# Vendored spec-kit tooling is not project code.
extend-exclude = [".specify", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["hyperdime", "scrap"]

[tool.mypy]
# numpy >= 2.5 stubs use Python 3.12 syntax; ruff still enforces 3.11-compatible code.
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tools"]
strict = true
ignore_missing_imports = true
